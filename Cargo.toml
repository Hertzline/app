[workspace]
resolver = "2"
members = [
  "crates/hertzline-app",
  "src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/Hertzline/app"

[workspace.dependencies]
# Sibling checkout: Hertzline/core next to Hertzline/app (local + CI).
hertzline-core = { path = "../core/crates/hertzline-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Verified 2026-11-14: crates.io max_stable tauri 2.12.5; tauri-build 2.7.4 (Apache-2.0 OR MIT).
tauri = { version = "=2.12.5", features = [] }
tauri-build = { version = "=2.7.4", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
