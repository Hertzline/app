# App CI. Actions pinned to commit SHAs (REPOS.md / RULES.md).
# Checks out Hertzline/core as a sibling for the path dependency.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app-test:
    name: app-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app

      - name: Checkout core sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hertzline/core
          path: core

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Fmt
        # Only the app package; --all would also fmt the sibling core workspace.
        run: cargo fmt -p hertzline-app -- --check

      - name: Clippy
        run: cargo clippy -p hertzline-app --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test -p hertzline-app --locked

      - name: Release build
        run: cargo build -p hertzline-app --release --locked
