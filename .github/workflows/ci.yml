# App CI. Actions pinned to commit SHAs (REPOS.md / RULES.md).
# Hertzline/.github pin: f4f947f31a5da82d0ca4828917490d2a1d1217b0 (HZ-003 / HZ-056).
# Checks out Hertzline/core as a sibling for the path dependency.
# license-audit in reusable-ci is false: path dep needs sibling checkout first.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shared:
    uses: Hertzline/.github/.github/workflows/reusable-ci.yml@f4f947f31a5da82d0ca4828917490d2a1d1217b0
    with:
      meta-ref: f4f947f31a5da82d0ca4828917490d2a1d1217b0
      pin-check: true
      license-audit: false
      has-secrets: false

  app-test:
    name: app-test (${{ matrix.os }})
    needs: [shared]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app

      - name: Checkout core sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hertzline/core
          path: core

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"

      - name: Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: HZ-056 hardening gate
        run: python scripts/check_hz056.py

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: License audit (cargo deny check licenses)
        run: cargo deny check licenses

      - name: Install npm deps
        run: npm ci

      - name: License audit (license-checker@25.0.1 production)
        run: npx --yes license-checker@25.0.1 --production --failOn "GPL;AGPL;SSPL;BUSL;Commons Clause"

      - name: Fmt
        # Only app workspace packages; --all would also fmt the sibling core workspace.
        run: cargo fmt -p hertzline-app -p hertzline -- --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Tauri build (no bundle)
        run: npx tauri build --no-bundle

      - name: Smoke shell (no window)
        env:
          HERTZLINE_APP_SMOKE: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            bin="$(find target/release -name 'hertzline.exe' -type f | head -n1)"
          else
            bin="$(find target/release -name hertzline -type f | head -n1)"
          fi
          test -n "${bin}"
          "${bin}"
          code=$?
          size="$(wc -c < "${bin}" | tr -d ' ')"
          echo "smoke_exit=${code} path=${bin} size=${size}"
          test "${code}" -eq 0
