<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hertzline</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/app.js" defer></script>
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <div class="layout">
      <aside class="rail">
        <div class="rail-brand">
          <svg class="brand-mark-svg" viewBox="0 0 40 32" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" d="M2 16 C7 8 12 24 18 16 C24 8 29 24 38 16"/>
            <path fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.4" d="M2 24h36"/>
          </svg>
          <div>
            <p class="brand" id="brand">Hertzline</p>
            <p class="brand-sub">strumento locale</p>
          </div>
        </div>
        <nav class="nav" id="nav" aria-label="Principale"></nav>
        <p class="rail-foot" id="rail-foot">no elevazione all'avvio</p>
      </aside>
      <div class="stage">
        <header class="top">
          <div class="top-copy">
            <p class="eyebrow">Flusso</p>
            <ol class="steps" aria-label="Flusso consigliato">
              <li data-step="measure"><span>01</span> Misura</li>
              <li data-step="actions"><span>02</span> Ottimizza</li>
              <li data-step="benchmark"><span>03</span> Verifica</li>
            </ol>
          </div>
          <p class="tag">Solo guadagni misurati sulla tua macchina.</p>
        </header>
        <main id="main" tabindex="-1" aria-live="polite">
          <header class="page-head">
            <h1 id="title">Caricamento</h1>
          </header>
          <div id="body"></div>
          <p class="meta" id="meta"></p>
        </main>
      </div>
    </div>
  </body>
</html>
